services:
  praxis:
    build: .
    ports:
      - "3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PRAXIS_HEADLESS: "true"
      PORT: "3000"
    volumes:
      # Invoice PDFs, screenshots and the workspace. The databases are in Neon.
      - praxis_data:/app/.data

volumes:
  praxis_data:
